<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LibreSky</title>
  <meta name="description" content="LibreSky is a Bluesky client for the browser.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    (function () {
      if (location.hostname === 'localhost') {
        location.replace(location.href.replace('//localhost', '//127.0.0.1'));
        return;
      }
      if (location.hostname.endsWith('github.io') && location.pathname === '/LibreSky') {
        location.replace('/LibreSky/' + location.search + location.hash);
        return;
      }
      try {
        var theme = localStorage.getItem('libresky.theme') || localStorage.getItem('libresky:theme');
        if (theme === 'black') theme = 'dark';
        if (!theme && matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="shell">
    <nav class="left" aria-label="Primary">
      <a class="brand" href="#/" aria-label="LibreSky home">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0085ff"/><circle cx="22" cy="11" r="3.2" fill="#fff"/><path d="M6 21c4-4 7-4 11 0s7 4 11 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="brand-name">Libre<span>Sky</span></span>
      </a>
      <a class="nav-link" data-nav="home" href="#/"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 10.4 12 3.6l8 6.8V20a1 1 0 0 1-1 1h-5.2v-6.2H10.2V21H5a1 1 0 0 1-1-1v-9.6z"/></svg><span class="label">Home</span></a>
      <a class="nav-link" data-nav="search" href="#/search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 1 1 4.64 13.36l4.25 4.25-1.42 1.42-4.25-4.25A7.5 7.5 0 0 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><span class="label">Search</span></a>
      <a class="nav-link" data-nav="notifications" href="#/notifications"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 22a2.4 2.4 0 0 0 2.35-2h-4.7A2.4 2.4 0 0 0 12 22zm7-5.2V11a7 7 0 0 0-5.2-6.75V3.5a1.8 1.8 0 1 0-3.6 0v.75A7 7 0 0 0 5 11v5.8L3.4 18.6A1 1 0 0 0 4.2 20.2h15.6a1 1 0 0 0 .8-1.6L19 16.8z"/></svg><span class="label">Notifications</span><span class="badge" id="notif-badge" hidden>0</span></a>
      <a class="nav-link" data-nav="messages" href="#/messages"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3.5h14A2.5 2.5 0 0 1 21.5 6v9a2.5 2.5 0 0 1-2.5 2.5H9.2L4.5 21.2V6A2.5 2.5 0 0 1 5 3.5z"/></svg><span class="label">Chat</span></a>
      <a class="nav-link" data-nav="feeds" href="#/feeds"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v3A1.5 1.5 0 0 1 18.5 10h-13A1.5 1.5 0 0 1 4 8.5v-3zm0 8A1.5 1.5 0 0 1 5.5 12h13a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 16.5v-3z"/></svg><span class="label">Feeds</span></a>
      <a class="nav-link" data-nav="lists" href="#/lists"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 6h12v2H8V6zM8 11h12v2H8v-2zm0 5h8v2H8v-2zM4.5 6.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm0 5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm0 5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg><span class="label">Lists</span></a>
      <a class="nav-link" data-nav="bookmarks" href="#/bookmarks"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.5 3h11A1.5 1.5 0 0 1 19 4.5V21l-7-3.4L5 21V4.5A1.5 1.5 0 0 1 6.5 3z"/></svg><span class="label">Bookmarks</span></a>
      <a class="nav-link" data-nav="profile" href="#/"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12.2a4.2 4.2 0 1 0-4.2-4.2 4.2 4.2 0 0 0 4.2 4.2zM4.8 20.2a7.2 7.2 0 0 1 14.4 0 .8.8 0 0 1-.8.8H5.6a.8.8 0 0 1-.8-.8z"/></svg><span class="label">Profile</span></a>
      <a class="nav-link" data-nav="settings" href="#/settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 7.2h6.1a2.4 2.4 0 0 0 4.6 0H20v2h-5.3a2.4 2.4 0 0 0-4.6 0H4v-2zm0 7.6h2.2a2.4 2.4 0 0 0 4.6 0H20v2H10.8a2.4 2.4 0 0 0-4.6 0H4v-2z"/></svg><span class="label">Settings</span></a>
      <button type="button" class="post-btn" data-act="compose"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg><span>Post</span></button>
      <button type="button" class="account" id="account-btn">
        <span class="avatar" id="account-avatar" data-initial="L"></span>
        <span class="account-text"><strong id="account-name">Sign in</strong><span id="account-handle">Bluesky account</span></span>
      </button>
    </nav>

    <main class="center">
      <header class="sticky-head">
        <div class="title-row">
          <button type="button" class="icon-btn" id="back" hidden aria-label="Back"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5 8 12l7 7"/></svg></button>
          <h1 id="title">Home</h1>
        </div>
        <div class="tabs" id="tabs" hidden></div>
      </header>
      <div id="view" aria-live="polite"></div>
    </main>

    <aside class="right">
      <form id="rail-search" class="search-form" role="search">
        <label class="search">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 1 1 4.64 13.36l4.25 4.25-1.42 1.42-4.25-4.25A7.5 7.5 0 0 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
          <input id="rail-q" placeholder="Search" autocomplete="off" enterkeyhint="search">
        </label>
      </form>
      <div id="rail-card"></div>
    </aside>
  </div>

  <nav class="tabbar" aria-label="Mobile">
    <a href="#/" aria-label="Home"><svg class="ico" viewBox="0 0 24 24"><path fill="currentColor" d="M4 10.4 12 3.6l8 6.8V20a1 1 0 0 1-1 1h-5.2v-6.2H10.2V21H5a1 1 0 0 1-1-1v-9.6z"/></svg></a>
    <a href="#/search" aria-label="Search"><svg class="ico" viewBox="0 0 24 24"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 1 1 4.64 13.36l4.25 4.25-1.42 1.42-4.25-4.25A7.5 7.5 0 0 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg></a>
    <a href="#/notifications" aria-label="Notifications"><svg class="ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22a2.4 2.4 0 0 0 2.35-2h-4.7A2.4 2.4 0 0 0 12 22zm7-5.2V11a7 7 0 0 0-5.2-6.75V3.5a1.8 1.8 0 1 0-3.6 0v.75A7 7 0 0 0 5 11v5.8L3.4 18.6A1 1 0 0 0 4.2 20.2h15.6a1 1 0 0 0 .8-1.6L19 16.8z"/></svg></a>
    <a href="#/messages" aria-label="Chat"><svg class="ico" viewBox="0 0 24 24"><path fill="currentColor" d="M5 3.5h14A2.5 2.5 0 0 1 21.5 6v9a2.5 2.5 0 0 1-2.5 2.5H9.2L4.5 21.2V6A2.5 2.5 0 0 1 5 3.5z"/></svg></a>
    <a href="#/profile" aria-label="Profile"><svg class="ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12.2a4.2 4.2 0 1 0-4.2-4.2 4.2 4.2 0 0 0 4.2 4.2zM4.8 20.2a7.2 7.2 0 0 1 14.4 0 .8.8 0 0 1-.8.8H5.6a.8.8 0 0 1-.8-.8z"/></svg></a>
  </nav>
  <button type="button" class="fab" data-act="compose" aria-label="Post"><svg class="ico" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg></button>

  <dialog id="login">
    <form id="login-form">
      <h2>Sign in</h2>
      <p class="dim">LibreSky uses your Bluesky account. Your password is entered on Bluesky, not here.</p>
      <label>Handle
        <input id="login-handle" name="username" autocomplete="username" placeholder="you.bsky.social" spellcheck="false">
      </label>
      <p class="form-error" id="login-error" hidden></p>
      <button class="primary" id="login-oauth" type="submit">Sign in with Bluesky</button>
      <button class="text-btn" id="login-app-toggle" type="button">Use an app password</button>
      <div id="app-password-box" hidden>
        <label>App password
          <input id="login-password" type="password" autocomplete="current-password">
        </label>
        <button class="primary" id="login-password-btn" type="button">Sign in</button>
        <p class="dim"><a href="https://bsky.app/settings/app-passwords" target="_blank" rel="noopener noreferrer">Create one in Bluesky settings</a></p>
      </div>
    </form>
  </dialog>

  <dialog id="compose">
    <form id="compose-form">
      <div class="compose-bar">
        <button type="button" class="text-btn" id="compose-cancel">Cancel</button>
        <button type="submit" class="primary small" id="compose-send" disabled>Post</button>
      </div>
      <div id="compose-context"></div>
      <textarea id="compose-text" rows="5" placeholder="What's up?" maxlength="2000"></textarea>
      <div id="compose-previews"></div>
      <div class="compose-tools">
        <label class="icon-btn" title="Add images">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 5.5h14A1.5 1.5 0 0 1 20.5 7v10a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 17V7A1.5 1.5 0 0 1 5 5.5zm1.2 9.2 2.3-2.8 1.8 2.1 2.6-3.4 4.4 5.6H6.2z"/></svg>
          <input id="compose-files" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
        </label>
        <span id="compose-count">300</span>
      </div>
    </form>
  </dialog>

  <dialog id="lightbox">
    <button type="button" class="icon-btn light-close" id="lightbox-close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button type="button" class="icon-btn light-nav prev" id="lightbox-prev" aria-label="Previous"><svg class="ico" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5 8 12l7 7"/></svg></button>
    <img id="lightbox-img" alt="">
    <button type="button" class="icon-btn light-nav next" id="lightbox-next" aria-label="Next"><svg class="ico" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"/></svg></button>
    <p id="lightbox-alt" hidden></p>
  </dialog>

  <div id="menu" class="menu" hidden></div>
  <div id="toasts"></div>
  <noscript><p class="empty">LibreSky needs JavaScript to reach Bluesky.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
