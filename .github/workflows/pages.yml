name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage static site
        run: |
          mkdir -p _site/download
          cp -a index.html 404.html client-metadata.json manifest.webmanifest sw.js LICENSE README.md CHANGES.md .nojekyll _site/
          cp -a css js assets _site/
          cp -a download/manifest.json _site/download/
          find download -maxdepth 1 -type f -name '*.zip.*' -exec cp -a {} _site/download/ \;
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
