<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="libreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#000000" stroke="#1f1f23" stroke-width="2"/>
  <!-- Left Wing -->
  <path d="M 50 50 C 35 20, 10 25, 18 55 C 24 75, 45 65, 50 50 Z" fill="url(#libreGrad)" opacity="0.95" filter="url(#glow)"/>
  <!-- Right Wing -->
  <path d="M 50 50 C 65 20, 90 25, 82 55 C 76 75, 55 65, 50 50 Z" fill="url(#libreGrad)" opacity="0.95" filter="url(#glow)"/>
  <!-- Center Core -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" filter="url(#glow)"/>
  <path d="M 47 42 Q 50 35 53 42" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
